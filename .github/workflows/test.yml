name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Decision dialog checks
        run: python3 tests/test_flow_decision_dialog.py
      - name: Fleet All tab checks
        run: |
          pip install pytest
          python3 -m pytest tests/test_flow_all_crew.py -q
